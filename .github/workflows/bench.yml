name: bench

# ci.yml compile-checks the benchmarks but never runs them, so the hot paths in
# PRD §5.1 -- admission and the suppression check, API-key verification,
# RecordEvent without a body read, the compiled filter rule cache, single-pass
# link rewriting and ranged GetMetrics -- were guarded only by tests that pin
# the regression someone already had once. This compares their timings and
# allocations against a base and fails on a significant regression.
#
# Not on every pull request: a fair comparison is ten interleaved rounds of
# each side, which is minutes of runner time, and a shared runner's noise is
# the same whether the change touched the send path or the README. Nightly on
# main against the previous main commit, and on demand for any branch.

on:
  schedule:
    # 03:17 UTC: off the hour, when scheduled jobs pile up on hosted runners.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: 'Commit to compare against. Empty: the merge-base with origin/main, or the previous main commit when run on main.'
        required: false
        default: ''
      threshold:
        description: 'Fail when time/op or allocs/op grows by more than this percent (p < 0.05).'
        required: false
        default: '25'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: benchmarks
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      # benchstat is pinned like everything else this repository runs: an
      # unpinned tool is whatever was published that morning.
      BENCHSTAT_VERSION: v0.0.0-20261009192801-be2c69fb417e
      BENCH_COUNT: '10'
      BENCH_TIME: 200ms
      BENCH_THRESHOLD: ${{ inputs.threshold || '25' }}
      BENCH_ALPHA: '0.05'

    steps:
      - uses: actions/checkout@v4
        with:
          # The base is found from history, so all of it.
          fetch-depth: 0
          path: head

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: head/go.sum

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}

      - name: Choose the base
        id: base
        working-directory: head
        env:
          REQUESTED: ${{ inputs.base }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [ -n "${REQUESTED:-}" ]; then
            base="$(git rev-parse "${REQUESTED}^{commit}")"
          else
            git fetch --quiet origin main
            base="$(git merge-base HEAD origin/main)"
            # On main itself the merge-base is HEAD; compare with the commit
            # before it, which is the previous merge.
            if [ "$base" = "$head_sha" ]; then
              base="$(git rev-parse HEAD~1)"
            fi
          fi
          echo "head $head_sha, base $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          git worktree add --detach ../base "$base"

      # The script comes from the head tree for both sides, so the package
      # list and the gate are the ones under review.
      - name: Run benchmarks
        run: head/scripts/ci/bench.sh run base head bench-out

      - name: Compare
        id: compare
        run: head/scripts/ci/bench.sh compare bench-out

      - name: Summary
        if: always()
        run: |
          if [ -f bench-out/benchstat.txt ]; then
            {
              echo "### Benchmarks: base ${{ steps.base.outputs.sha }} vs head ${{ github.sha }}"
              echo '```'
              cat bench-out/benchstat.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchstat-${{ github.run_id }}
          path: bench-out/
          if-no-files-found: warn
          retention-days: 30
