name: ci

# release.yml only runs on a tag, so until now nothing verified a change before
# it became a release. This runs the suite that already exists on every push and
# pull request, so a regression is caught while it is still cheap to fix.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    # Pinned to Linux: the postgres and greenmail service containers below are a
    # Linux-only runner feature, so this job cannot move to a macOS self-hosted
    # runner however convenient that would be.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: panmail
          POSTGRES_PASSWORD: panmail_test
          POSTGRES_DB: panmail_test
        ports:
          - 5432:5432
        # Without a health check the tests start before the server accepts
        # connections and fail for a reason that has nothing to do with them.
        options: >-
          --health-cmd "pg_isready -U panmail -d panmail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # A real IMAP server, because IDLE cannot be judged from a fake. Whether
      # the server pushes an unsolicited EXISTS, whether the client notices,
      # and what happens when the connection dies are properties of the
      # protocol and the two implementations, not of our code.
      imap:
        image: greenmail/standalone:2.1.0
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
        ports:
          - 3143:3143
          - 3025:3025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race is worth the wall-clock here. This is a concurrent mail gateway:
      # the outbox hands claimed rows to parallel workers and the login limiter
      # is shared mutable state, and a data race in either is the kind of fault
      # that only shows up under production load.
      - name: Test
        run: go test -race ./...

      # The same tests again against PostgreSQL, which is what a multi-tenant
      # deployment actually runs. Running only on SQLite hid real faults for as
      # long as it was the only engine: SQLite serialises writers, so the outbox
      # claim appeared safe without the row locks PostgreSQL needs, and it
      # validates neither UUID columns nor JSON ones, so values that PostgreSQL
      # rejects outright were stored happily.
      - name: Test against PostgreSQL
        env:
          PANMAIL_TEST_POSTGRES: postgres://panmail:panmail_test@127.0.0.1:5432/panmail_test?sslmode=disable
        run: go test ./...

      # Skipped entirely when these are unset, so this is the only place the
      # IDLE integration tests actually run.
      - name: Test IMAP IDLE against a real server
        env:
          PANMAIL_TEST_IMAP: 127.0.0.1:3143
          PANMAIL_TEST_SMTP: 127.0.0.1:3025
        run: go test ./internal/inbound/... -count=1

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^web/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Nothing was watching for this, so the answer was whatever the toolchain
      # happened to be on the day someone last built. It had drifted to seven
      # standard-library advisories, every one of them fixed in a patch release
      # already available — an upgrade nobody knew to make.
      #
      # govulncheck reports what this code actually reaches rather than every
      # advisory against every module in the graph, so a failure here is a call
      # path that exists and not a line in a dependency tree.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: frontend
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: bun run lint

      # bun's built-in runner, so this needs no test dependency. Covers the
      # email HTML generator, where a regression ships silently: bad output
      # renders fine in the builder's own preview and only breaks in the
      # recipient's client.
      - name: Test
        working-directory: web
        run: bun run test

      # `bun run build` is `tsc -b && vite build`, so this type-checks as well
      # as bundling.
      - name: Build
        working-directory: web
        run: bun run build

  release-build:
    # The artifact goreleaser actually ships: the UI embedded into the binary
    # via the builtui tag. Built separately because embedding is its own failure
    # mode — web/dist missing or misnamed passes both jobs above and breaks only
    # at tag time, which is the worst moment to find out.
    name: release build
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build embedded binary
        run: go build -tags builtui -o panmail ./cmd/api

      - name: Smoke test the binary
        run: ./panmail --version

  image:
    # The container is what a Kubernetes deployment actually runs, and it is a
    # separate build from the release binaries — different base, different UI
    # step, its own way to break. An image nobody builds is an image that is
    # broken the day someone needs it.
    name: container image
    # Pinned to Linux: this builds a container image, which needs a Docker daemon
    # the macOS self-hosted runner does not have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t panmail:ci --build-arg VERSION=ci .

      # Proves the binary runs and, by printing a version, that the ldflag
      # reached it. The embedded UI is covered by release-build.
      - name: Smoke test
        run: docker run --rm panmail:ci --version

      - name: Refuse to run as root
        run: |
          user="$(docker run --rm --entrypoint id panmail:ci -u)"
          if [ "$user" = "0" ]; then
            echo "the image runs as root"
            exit 1
          fi
          echo "runs as uid $user"

  generated:
    # Whether the committed output of `buf generate` still matches the .proto
    # files. This was deliberately unchecked while the TypeScript client under
    # web/src/api had drifted behind them; both sides are back in sync, so the
    # gate that would have caught that drift can exist.
    #
    # Drift is quiet in a way that matters here. Go fails to compile against a
    # stale message, so the backend notices. The generated client does not: the
    # UI keeps compiling against a field the server no longer sends, and the
    # first sign is a value arriving undefined at runtime.
    name: generated code is current
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: bufbuild/buf-setup-action@v1

      - name: Regenerate
        run: buf generate

      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "The committed generated code does not match the .proto files."
            echo "Run 'buf generate' and commit the result."
            git diff --stat
            exit 1
          fi
