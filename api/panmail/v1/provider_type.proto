syntax = "proto3";

package panmail.v1;

option go_package = "github.com/gsoultan/panmail/api/panmail/v1;panmailv1";

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_SMTP = 1;

  // 2 to 5 held the API providers when they were declared but never
  // implemented. The numbers stay reserved because a stored provider row may
  // still carry one, and reusing them would silently reinterpret it as a
  // working provider of a different kind. The names are free again now that
  // the types actually exist, so the new values start at 8.
  reserved 2 to 5;

  PROVIDER_TYPE_IMAP = 6;
  PROVIDER_TYPE_POP3 = 7;

  PROVIDER_TYPE_SENDGRID = 8;
  PROVIDER_TYPE_SES = 9;
  PROVIDER_TYPE_POSTMARK = 10;
  PROVIDER_TYPE_MAILGUN = 11;
}
