syntax = "proto3";

package panmail.v1;

option go_package = "github.com/gsoultan/panmail/api/panmail/v1;panmailv1";

import "panmail/v1/event.proto";
import "panmail/v1/common.proto";
import "google/protobuf/struct.proto";

service EmailService {
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
}

message SendEmailRequest {
  string provider_id = 1;
  string from = 2;
  repeated string to = 3;
  repeated string cc = 12;
  repeated string bcc = 13;
  string subject = 4;
  string body = 5 [deprecated = true];
  bool is_html = 6 [deprecated = true];
  string body_html = 9;
  string body_text = 10;
  string template_id = 7;
  google.protobuf.Struct template_data = 8;
  repeated Attachment attachments = 11;
  // Makes a retried send safe. A second request from the same tenant with the
  // same key within 24 hours of the first being accepted is answered with the
  // first one's response and queues nothing; the same key with a different
  // request is refused with ALREADY_EXISTS. At most 255 printable ASCII
  // characters. May be sent as the Idempotency-Key HTTP header instead.
  string idempotency_key = 14;
  // The address replies should go to, when it is not the From address.
  string reply_to = 15;
  // The Message-ID of the message this one answers, angle brackets included,
  // so the recipient's client threads the reply with the original.
  string in_reply_to = 16;
  // The Message-IDs of the conversation so far, oldest first, angle brackets
  // included. Sent as the References header.
  repeated string references = 17;
  // Where a read receipt should be sent, when the sender asks for one. Sent
  // as the Disposition-Notification-To header; the recipient's client decides
  // whether to honour it.
  string disposition_notification_to = 18;
  // Copy this message back to the sender as the tenant's Sent copies setting
  // says (see SentCopyService). Ignored when that setting is NONE. Messages
  // submitted over SMTP set it, because the mail client that sent them
  // expects to find them in its Sent folder.
  bool save_sent_copy = 19;
}

message SendEmailResponse {
  string message_id = 1;
  EmailEventType status = 2;
  string error = 3;
}
