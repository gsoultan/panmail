syntax = "proto3";

package panmail.v1;

option go_package = "github.com/gsoultan/panmail/api/panmail/v1;panmailv1";

service SystemSettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);

  // Opens or closes the SMTP submission listener at runtime. Admin only.
  rpc UpdateSmtpSubmission(UpdateSmtpSubmissionRequest) returns (UpdateSmtpSubmissionResponse);
}

message GetSettingsRequest {}

message GetSettingsResponse {
  SystemSettings settings = 1;

  // How this process is accepting SMTP submissions. Read-only: it reports
  // process state, not configuration, and UpdateSettings does not accept it.
  SmtpSubmission smtp_submission = 2;
}

message UpdateSettingsRequest {
  SystemSettings settings = 1;
}

message UpdateSettingsResponse {
  SystemSettings settings = 1;
}

// SmtpBindScope is where the submission listener accepts connections, as a
// closed set rather than a host string.
//
// An address typed into a form is unvalidatable input that decides how far a
// port is reachable, so the wire carries the decision instead of the address:
// there are exactly two answers worth giving, and neither can be malformed.
enum SmtpBindScope {
  SMTP_BIND_SCOPE_UNSPECIFIED = 0;

  // 127.0.0.1 — reachable only from this host. The only scope on which
  // cleartext AUTH is allowed, because nothing can be on the path.
  SMTP_BIND_SCOPE_LOOPBACK = 1;

  // 0.0.0.0 — every interface. Requires TLS: see allow_insecure_auth.
  SMTP_BIND_SCOPE_ALL_INTERFACES = 2;
}

// TlsCertificateInfo describes the stored keypair without disclosing it.
//
// Everything here is derived from the certificate, which is public by
// construction. The private key has no field in any response message, so there
// is no code path that can read one back out of the gateway.
message TlsCertificateInfo {
  string subject = 1;

  // The names this certificate is valid for, so an administrator can see
  // whether it matches the host their applications will dial.
  repeated string dns_names = 2;

  string issuer = 3;
  string not_before = 4;
  string not_after = 5;

  // Lowercase hex SHA-256 of the DER, the same value openssl prints. It is how
  // an operator confirms the gateway holds the certificate they meant to
  // install without the gateway having to show it.
  string fingerprint_sha256 = 6;

  // True when not_after has passed. Stored certificates are not deleted when
  // they expire — the listener keeps serving the one it has, and saying so is
  // more useful than silently refusing to start.
  bool expired = 7;
}

// SmtpSubmission reports the SMTP submission listener, so the dashboard can
// show an integrator real connection details instead of guessing at them.
//
// It is deliberately not part of SystemSettings. SystemSettings is readable by
// any authenticated caller, and this message is adjacent to key material;
// keeping them apart means a widening of that read can never reach the
// listener's configuration by accident.
message SmtpSubmission {
  // Whether submission is turned on. This is the setting, not proof of a live
  // socket: a listener that was enabled but could not bind reports enabled with
  // last_error set, because a form needs to show the administrator the state
  // they asked for alongside the reason it did not take.
  bool enabled = 1;

  // The hostname clients should connect to, empty when the listener binds
  // every interface. A wildcard bind gives no hostname worth reporting, and
  // inventing one would send integrators somewhere that does not answer; the
  // dashboard falls back to the host in base_url and says what it did.
  string host = 2;

  int32 port = 3;

  // Whether the listener offers STARTTLS.
  bool starttls = 4;

  // Whether AUTH is accepted on an unencrypted connection. True means an API
  // key can cross the network in the clear, which is a deployment decision
  // worth showing rather than burying in a log line at startup.
  bool insecure_auth_allowed = 5;

  // True when this process was started with --smtp-addr. Flags win over the
  // stored configuration, so an existing deployment keeps behaving exactly as
  // it did, and the dashboard renders read-only rather than offering an edit
  // that would be ignored.
  bool managed_by_flags = 6;

  // Whether UpdateSmtpSubmission would be accepted. False also when no
  // encryption key is configured, because a TLS private key must never be
  // stored in the clear.
  bool editable = 7;

  // Why editable is false, in words meant for an administrator. Empty when
  // editable is true.
  string not_editable_reason = 8;

  SmtpBindScope bind_scope = 9;

  // The stored keypair, absent when none is stored.
  TlsCertificateInfo certificate = 10;

  // Why the listener is not running despite being enabled — a port already in
  // use, or a bind refused. Empty when the desired and actual states agree.
  //
  // This exists because enabling now happens at runtime: at startup a listener
  // that would not bind was fatal, so the two could not disagree. A toggle in a
  // form cannot take the process down, so the failure has to be reportable.
  string last_error = 11;
}

// SmtpSubmissionConfig is the desired state of the listener.
//
// The TLS fields are write-only: they are accepted here and never returned by
// any read. Omitting both leaves whatever is already stored in place, so an
// administrator can change the port without re-pasting a private key.
message SmtpSubmissionConfig {
  bool enabled = 1;

  SmtpBindScope bind_scope = 2;

  // The listen port. Submission ports are 587 (STARTTLS) and 2525; 25 is
  // refused, because it is the port a mail exchanger answers on and this
  // gateway is not one — binding it invites relay expectations it will not
  // meet.
  int32 port = 3;

  // PEM, including any intermediates. Both TLS fields must be sent together.
  string tls_certificate_pem = 4;

  // PEM. Encrypted with the gateway's data key before it is stored, and never
  // read back.
  string tls_private_key_pem = 5;

  // Permit AUTH over an unencrypted connection. Honoured only when bind_scope
  // is LOOPBACK; on any other scope the request is refused rather than
  // downgraded, because the SMTP password is an API key and this field decides
  // whether it crosses a network in the clear.
  bool allow_insecure_auth = 6;

  // Discard the stored keypair. Separate from sending empty PEM fields, which
  // means "leave it alone" — the two are opposite instructions and an empty
  // string cannot express both.
  bool clear_tls = 7;
}

message UpdateSmtpSubmissionRequest {
  SmtpSubmissionConfig config = 1;
}

message UpdateSmtpSubmissionResponse {
  // The listener as it now stands, read back from the supervisor rather than
  // echoed from the request, so a change that was stored but could not be
  // bound reports last_error instead of a success the caller cannot see.
  SmtpSubmission smtp_submission = 1;
}

// SystemSettings holds the global, admin-editable configuration.
//
// Every *_retention_days field is a whole number of days, and zero always
// means "keep forever" — a retention nobody has configured must never delete
// anything. The UI says so on each field; do not add a field whose zero value
// means something else.
// **Every scalar here is `optional`, and that is load bearing.** An update
// applies only the fields it carries; one that omits a field leaves it alone.
//
// It used to be full-replace, which meant a caller changing base_url reset all
// seven retention policies to zero — and zero means keep forever, so retention
// silently stopped without an error, a log line, or anything to notice before a
// disk filled. Presence is what tells "keep forever" from "I did not mention
// it", and those are opposite instructions that a plain proto3 scalar renders
// identically.
//
// retry_pattern is the exception, because a repeated field has no presence: an
// empty list means "leave it alone" rather than "clear it". Send the values to
// change it. Nothing is lost — an empty stored pattern already reads back as
// the built-in default, so the default is expressible by sending it.
message SystemSettings {
  optional string base_url = 1;
  optional int32 log_retention_days = 2;
  repeated string retry_pattern = 3;

  // Message bodies and attachments, deleted outright rather than archived:
  // an archive of the content is the content, so archiving it would defeat
  // the retention it is meant to enforce.
  optional int32 message_retention_days = 4;

  // Permanently failed outbox rows. Only FAILED qualifies — pending,
  // deferred and claimed rows are live work.
  optional int32 outbox_retention_days = 5;

  // Delivered and permanently failed webhook notifications.
  optional int32 webhook_retention_days = 6;

  // Application logs from the Pebble log store.
  optional int32 app_log_retention_days = 7;

  // Received mail. Deleting inbound mail destroys the only copy panmail
  // holds, so this defaults to keeping it forever.
  optional int32 inbound_retention_days = 8;

  // The JSONL archives written when delivery events expire. This is the
  // escape hatch for log_retention_days, so it also defaults to forever.
  optional int32 archive_retention_days = 9;

  // How long a message a filter rule held waits for a reviewer.
  //
  // Applies to messages held from now on, not to ones already waiting. Their
  // deadline was stamped when they were held and sent to webhook subscribers
  // in the mail.held event; moving it afterwards would break a date this
  // gateway already promised.
  optional int32 quarantine_retention_days = 10;

  // How much of a stored message body the delivery-details view is allowed to
  // show. Transactional mail carries the things it carries — a password reset
  // sends a password — and anyone who can open the dashboard can read it back
  // months later.
  //
  // Redaction happens in the gateway, not the browser: the body is served over
  // the API, so masking it in the UI would leave the secret in the response for
  // anyone who opens the network tab. Stored mail is never rewritten; only what
  // leaves through the API is masked.
  ContentRedaction content_redaction = 11;
}

// ContentRedaction is how hard the gateway looks for secrets in a message body
// before showing it back.
//
// UNSPECIFIED is distinct from OFF on purpose, and it is the same distinction
// the two nullable retention columns exist for: "nobody has chosen" has to be
// tellable from "somebody chose none", or an operator who deliberately turned
// redaction off gets it switched back on by the next default change.
enum ContentRedaction {
  CONTENT_REDACTION_UNSPECIFIED = 0;

  // Show the body as stored. A deliberate choice, and the only value that
  // shows a password in the dashboard.
  CONTENT_REDACTION_OFF = 1;

  // The default. Masks the value after a password-like label — password, pwd,
  // passcode, passphrase — and, with no label needed, credentials whose shape
  // identifies them: PEM private key blocks, JWTs, and issued keys that carry
  // their own prefix (AWS, GitHub, Stripe, Slack, Google, SendGrid).
  //
  // The shapes are on at the default level because they are issued rather than
  // chosen, so there is no false positive to weigh against leaking one. The
  // label patterns stay narrow, so a message that merely discusses passwords
  // survives intact.
  CONTENT_REDACTION_PASSWORDS = 2;

  // Adds one-time codes: OTP, PIN, verification and security codes. Worth as
  // much as a password for as long as they are valid, which is usually longer
  // than the message takes to reach the dashboard.
  CONTENT_REDACTION_CODES = 3;

  // Adds bearer-token and API-key labels, and payment card numbers validated
  // with the Luhn checksum. The widest setting and the most likely to mask
  // something that was not a secret — a card number is a plausible run of
  // digits rather than an issued shape, which is why it waits for this level
  // instead of firing at the default.
  CONTENT_REDACTION_SECRETS = 4;
}
