syntax = "proto3";

package panmail.v1;

import "panmail/v1/webhook.proto";

option go_package = "github.com/gsoultan/panmail/api/panmail/v1;panmailv1";

service WebhookService {
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);

  // Sends one signed sample notification to a subscription's URL right away
  // and reports how the endpoint answered. Nothing is queued or retried: the
  // point is to see the answer while setting the endpoint up.
  rpc TestWebhook(TestWebhookRequest) returns (TestWebhookResponse);

  // The body a subscriber receives for each event, filled with sample data.
  rpc ListWebhookEventSamples(ListWebhookEventSamplesRequest) returns (ListWebhookEventSamplesResponse);
}

message CreateWebhookRequest {
  string name = 1;
  string url = 2;
  repeated WebhookTriggerEvent events = 3;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
}

message ListWebhooksRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  string next_page_token = 2;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message UpdateWebhookRequest {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated WebhookTriggerEvent events = 4;
  bool active = 5;
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message TestWebhookRequest {
  string id = 1;
  // Which event's sample to send. Unspecified sends the first event the
  // subscription listens for.
  WebhookTriggerEvent event = 2;
}

message TestWebhookResponse {
  // True when the endpoint answered with a 2xx status.
  bool success = 1;
  // The status the endpoint answered with; zero when it could not be reached.
  int32 status_code = 2;
  // Why the request failed before an answer came back, or why the answer was
  // not a success.
  string error = 3;
  // The start of the endpoint's response body, for diagnosing a refusal.
  string response_body = 4;
  int64 duration_ms = 5;
  // The event that was sent and the exact body posted.
  WebhookTriggerEvent event = 6;
  string payload = 7;
}

message ListWebhookEventSamplesRequest {}

message WebhookEventSample {
  WebhookTriggerEvent event = 1;
  // What the event means, in a sentence.
  string description = 2;
  // The JSON body a subscriber receives, pretty-printed.
  string payload = 3;
}

message ListWebhookEventSamplesResponse {
  repeated WebhookEventSample samples = 1;
}
