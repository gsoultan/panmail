version: 2
project_name: panmail

before:
  hooks:
    - bun install --cwd web
    - go mod tidy
    # `go generate` is what builds the UI -- the only directive in the tree is
    # cmd/api/main.go's `bun run --cwd ../../web build` -- so the version has to
    # ride on this hook. A separate versioned build hook before it does not
    # work: this one reruns the build without the variable and overwrites it,
    # which is how releases came to ship a UI labelled v0.0.0.
    #
    # {{ .Version }} rather than $GORELEASER_CURRENT_TAG, which goreleaser does
    # not export to before-hooks -- the old expansion always fell through to its
    # :-v0.0.0 default. It is also exactly what the main.Version ldflag below
    # gets, so the sidebar and `panmail --version` cannot drift apart, and it
    # carries no leading "v": the UI adds that when it renders, as the CLI does.
    - sh -c "VITE_APP_VERSION={{ .Version }} go generate ./..."

builds:
  - id: panmail
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/api
    binary: panmail
    flags:
      - -tags=builtui
    ldflags:
      - -s -w -X main.Version={{.Version}}

nfpms:
  - id: panmail
    package_name: panmail
    vendor: Panmail
    homepage: https://github.com/gsoultan/panmail
    maintainer: G Soultan <gsoultan@jetbrains.com>
    description: High-performance, production-grade email gateway.
    license: MIT
    formats:
      - deb
      - rpm
    dependencies:
      - systemd
    contents:
      - src: configs/db_config.yaml.example
        dst: /etc/panmail/db_config.yaml.example
        type: config
      - src: README.md
        dst: /usr/share/doc/panmail/README.md
      - src: LICENSE
        dst: /usr/share/doc/panmail/LICENSE
    overrides:
      deb:
        contents:
          - src: scripts/panmail.service
            dst: /lib/systemd/system/panmail.service
      rpm:
        contents:
          - src: scripts/panmail.service
            dst: /usr/lib/systemd/system/panmail.service
    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/prerm.sh
      postremove: scripts/postremove.sh

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - configs/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
