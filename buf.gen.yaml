version: v2
managed:
  enabled: true
# Every plugin is pinned. An unpinned remote plugin is whatever the registry
# serves today, so a new release rewrites the committed code and fails the
# drift check on a PR that never touched a .proto. Bump these on purpose,
# together with the runtime in go.mod, and commit what they generate.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: api
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: api
    opt: paths=source_relative
  # protoc-gen-es v2 emits the service descriptors as well as the messages, so
  # there is no separate connect-es plugin and no *_connect.ts files any more:
  # a Connect client is built from the descriptor in the same _pb.ts.
  - remote: buf.build/bufbuild/es:v2.14.0
    out: web/src/api
    opt:
      - target=ts
      # The app is bundled by Vite with bundler resolution, which resolves
      # extensionless imports. Emitting .js extensions here would be correct
      # for plain ESM and wrong for every import in this codebase.
      - import_extension=none
